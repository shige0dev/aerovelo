<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroVelo - 3D Terrain Virtual Cycling</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- MapLibre GL JS (3D Terrain & Satellite) -->
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
</head>
<body>
    <!-- Fullscreen 3D Map Container -->
    <div id="map"></div>

    <!-- UI Overlay (メイン操作パネル) -->
    <div id="ui-panel">
        <header class="panel-header">
            <div class="header-top">
                <h1>AeroVelo <span>3D</span></h1>
                <div class="header-actions">
                    <span class="version-badge" id="app-version">v1.3.4</span>
                    <button type="button" id="btn-modal-settings" class="icon-btn" title="設定 (GPX / トレーナー / テスト)">⚙️</button>
                    <button type="button" id="btn-fullscreen" class="icon-btn" title="全画面表示 (F11)">⛶</button>
                </div>
            </div>
            <!-- コースタイトル独立表示行 -->
            <div class="course-title-row">
                <span id="course-name-display" class="course-name-badge">読み込み中...</span>
            </div>
        </header>

        <!-- Progress, Elevation Profile & Playback Controls (合体配置) -->
        <section class="control-group progress-group">
            <div class="progress-main-row">
                <div class="progress-info-wrap">
                    <span class="ctrl-title">進捗</span>
                    <div class="input-wrap">
                        <input type="number" id="progress-input" min="0" max="100" step="0.1" value="0.0">
                        <span class="unit">%</span>
                    </div>
                </div>
                <div class="inline-play-btns">
                    <button id="btn-play" class="btn primary mini-ctrl-btn icon-play-btn" title="自動再生 (Auto Fly)">▶</button>
                    <button id="btn-reset" class="btn secondary mini-ctrl-btn" title="スタート地点に戻る (0%)">0%</button>
                </div>
            </div>

            <!-- スライダーの真上に合体した標高プロファイルグラフ -->
            <div class="elevation-slider-wrapper">
                <div class="elevation-canvas-box">
                    <canvas id="elevation-canvas" width="200" height="42"></canvas>
                </div>
                <input type="range" id="progress-slider" min="0" max="100" step="0.05" value="0" class="overlay-slider">
            </div>
        </section>

        <!-- Compact Speed Control -->
        <section class="control-group speed-group">
            <div class="label-row">
                <label for="speed-slider">速度</label>
                <span id="speed-val" class="sub-val">25 km/h</span>
            </div>
            <input type="range" id="speed-slider" min="1" max="50" step="1" value="25">
        </section>

        <!-- Compact HUD Metrics -->
        <section class="hud-group">
            <div class="metrics-grid compact-grid">
                <div class="metric-card">
                    <span class="metric-label">距離</span>
                    <span class="metric-value"><span id="val-distance">0.00</span> <small>km</small></span>
                    <span class="metric-sub" id="val-total-distance">/ 0.00 km</span>
                </div>
                <div class="metric-card">
                    <span class="metric-label">標高</span>
                    <span class="metric-value"><span id="val-altitude">0.0</span> <small>m</small></span>
                </div>
                <div class="metric-card">
                    <span class="metric-label">斜度</span>
                    <span class="metric-value" id="val-slope-wrap">
                        <span id="val-slope">+0.0</span> <small>%</small>
                        <span id="slope-cap-badge" class="cap-badge" style="display: none;">MAX 8%</span>
                    </span>
                    <span class="metric-sub" id="val-trainer-slope">Trainer: +0.0%</span>
                </div>
                <div class="metric-card ble-metric-card" id="card-power">
                    <span class="metric-label">Power</span>
                    <span class="metric-value"><span id="val-power">--</span> <small>W</small></span>
                </div>
                <div class="metric-card ble-metric-card" id="card-cadence">
                    <span class="metric-label">Cadence</span>
                    <span class="metric-value"><span id="val-cadence">--</span> <small>rpm</small></span>
                </div>
                <div class="metric-card">
                    <span class="metric-label">経緯度</span>
                    <span class="metric-coords" id="val-coords">0.00, 0.00</span>
                </div>
            </div>
        </section>

        <!-- Camera Controls (メインダイアログに常駐) -->
        <section class="control-group camera-group">
            <div class="btn-group">
                <button id="cam-chase" class="btn toggle active">ライダー追従 (Track)</button>
                <button id="cam-free" class="btn toggle">自由操作 (Free)</button>
            </div>

            <!-- Camera Adjustment Sliders -->
            <div id="camera-adjust-box" class="camera-adjust-box">
                <div class="label-row">
                    <label for="cam-orbit-slider">アングル</label>
                    <span id="cam-orbit-val" class="sub-val">0° (真後ろ)</span>
                </div>
                <input type="range" id="cam-orbit-slider" min="-180" max="180" step="5" value="0">

                <div class="label-row" style="margin-top: 4px;">
                    <label for="cam-pitch-slider">Pitch (仰角)</label>
                    <span id="cam-pitch-val" class="sub-val">68°</span>
                </div>
                <input type="range" id="cam-pitch-slider" min="20" max="75" step="1" value="68">

                <div class="label-row" style="margin-top: 4px;">
                    <label for="cam-zoom-slider">Zoom (距離)</label>
                    <span id="cam-zoom-val" class="sub-val">16.5</span>
                </div>
                <input type="range" id="cam-zoom-slider" min="13.0" max="18.5" step="0.1" value="16.5">
            </div>
        </section>
    </div>

    <!-- 統合設定モーダル (⚙️ フラット表示) -->
    <div id="modal-settings" class="modal-backdrop" style="display: none;">
        <div class="modal-dialog">
            <div class="modal-header">
                <h3>⚙️ 設定 (Settings)</h3>
                <button type="button" class="modal-close" data-close="modal-settings">✕</button>
            </div>
            <div class="modal-body">
                <!-- セクション 1: コース選定・GPX -->
                <div class="settings-section">
                    <div class="settings-sec-title">📁 コース選定・GPX</div>
                    <section class="control-group gpx-section">
                        <div class="preset-row">
                            <select id="preset-select" class="preset-select">
                                <option value="gpx/hiyoshi_12.5km_D738.gpx" selected>🇯🇵 Hiyoshi (12.5km D+738m)</option>
                                <option value="gpx/shimanami_77.2km_D1903.gpx">🇯🇵 Shimanami (77.2km D+1903m)</option>
                                <option value="gpx/kashida_27.9km_D1095.gpx">🇯🇵 Kashida (27.9km D+1095m)</option>
                            </select>
                        </div>
                        <div class="gpx-actions-row">
                            <input type="file" id="gpx-file-input" accept=".gpx" style="display: none;">
                            <div id="drop-zone" class="action-item drop-zone">
                                <span class="action-label">Drop</span>
                            </div>
                            <button type="button" id="btn-browse" class="action-item action-btn">Explorer</button>
                            <a href="https://gpx-edit-pro.ovh/editeur-gpx/?lang=ja" target="_blank" rel="noopener noreferrer" class="action-item action-link">Editor ↗</a>
                        </div>
                        <div class="gsi-row">
                            <button type="button" id="btn-gsi-dem" class="gsi-btn" title="国土地理院 5mメッシュ(DEM5A)レーザー測量データで標高と斜度を精密再計算">
                                <span class="gsi-indicator"></span>
                                <span id="gsi-btn-text">5mメッシュ標高で補正</span>
                            </button>
                        </div>
                    </section>
                </div>

                <!-- セクション 2: スマートトレーナー接続 -->
                <div class="settings-section">
                    <div class="settings-sec-title">⚡ スマートトレーナー (FTMS)</div>
                    <section class="control-group ble-section">
                        <div class="ble-bar">
                            <button type="button" id="btn-ble-connect" class="ble-btn">
                                <span class="ble-dot" id="ble-indicator"></span>
                                <span id="ble-status-text">⚡ スマートトレーナー接続</span>
                            </button>
                            <button type="button" id="btn-ble-disconnect" class="ble-disconnect-btn" style="display: none;" title="切断">✕</button>
                        </div>
                    </section>
                </div>

                <!-- セクション 3: 手動負荷設定 -->
                <div class="settings-section">
                    <div class="settings-sec-title">🛠️ 手動負荷設定</div>
                    <div id="test-controls-box" class="test-controls-box">
                        <!-- Manual Slope Slider -->
                        <div class="label-row">
                            <label for="test-slope-slider">手動指示負荷 (Slope)</label>
                            <span id="test-slope-val" class="sub-val">+0.0 %</span>
                        </div>
                        <input type="range" id="test-slope-slider" min="-3" max="7" step="0.2" value="0">

                        <!-- Quick Presets -->
                        <div class="test-presets-row">
                            <button type="button" class="btn-preset-slope" data-val="0">0%</button>
                            <button type="button" class="btn-preset-slope" data-val="1">1%</button>
                            <button type="button" class="btn-preset-slope" data-val="2">2%</button>
                            <button type="button" class="btn-preset-slope" data-val="3">3%</button>
                            <button type="button" class="btn-preset-slope" data-val="4">4%</button>
                            <button type="button" class="btn-preset-slope" data-val="5">5%</button>
                            <button type="button" class="btn-preset-slope" data-val="7">7%</button>
                        </div>

                        <!-- Auto Sweep -->
                        <div class="test-lfo-box">
                            <div class="lfo-controls-row">
                                <button type="button" id="btn-lfo-toggle" class="btn secondary mini-btn">自動連続スキャン 開始</button>
                                <div class="lfo-period-wrap">
                                    <label for="lfo-period-select">周期:</label>
                                    <select id="lfo-period-select" class="mini-select">
                                        <option value="10">10秒</option>
                                        <option value="20" selected>20秒</option>
                                        <option value="30">30秒</option>
                                        <option value="60">60秒</option>
                                    </select>
                                </div>
                                <div class="lfo-range-wrap">
                                    <span class="lfo-range-text">0% ↔ 7%</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="src/main.js"></script>
</body>
</html>
