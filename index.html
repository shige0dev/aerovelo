<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroVelo - 3D Terrain Virtual Cycling</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- MapLibre GL JS (3D Terrain & Satellite) -->
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
</head>
<body>
    <!-- Fullscreen 3D Map Container -->
    <div id="map"></div>

    <!-- UI Overlay -->
    <div id="ui-panel">
        <header class="panel-header">
            <div class="header-top">
                <h1>AeroVelo <span>3D Terrain</span></h1>
                <span class="version-badge" id="app-version">v0.5.0</span>
            </div>
            <p class="subtitle" id="course-title">実地形 3D 衛星空撮バーチャルサイクリング</p>
        </header>

        <!-- GPX Importer Section (Compact) -->
        <section class="control-group gpx-section">
            <div class="gpx-compact-row">
                <input type="file" id="gpx-file-input" accept=".gpx" style="display: none;">
                <div id="drop-zone" class="drop-zone">
                    <span class="drop-text">📁 GPXドロップ または <button type="button" id="btn-browse" class="btn-link">選択</button></span>
                </div>
                <a href="https://gpx-edit-pro.ovh/editeur-gpx/?lang=ja" target="_blank" rel="noopener noreferrer" class="tool-link">エディタ ↗</a>
            </div>
            <div id="course-meta" class="course-meta">
                <span class="badge-active">現在: </span>
                <span id="active-course-name">本栖湖レイクサイド (サンプル)</span>
            </div>
        </section>

        <!-- Progress & Speed Control -->
        <section class="control-group">
            <div class="label-row">
                <label for="progress-slider">コース進捗率</label>
                <div class="input-wrap">
                    <input type="number" id="progress-input" min="0" max="100" step="0.1" value="0.0">
                    <span class="unit">%</span>
                </div>
            </div>
            <input type="range" id="progress-slider" min="0" max="100" step="0.05" value="0">
        </section>

        <!-- Playback Controls with Speed Slider (km/h) -->
        <section class="control-group">
            <div class="buttons-row">
                <button id="btn-play" class="btn primary">再生 (Auto Fly)</button>
                <button id="btn-reset" class="btn secondary">リセット (0%)</button>
            </div>
            <div class="label-row" style="margin-top: 6px;">
                <label for="speed-slider">走行速度 (シミュレーション)</label>
                <span id="speed-val" class="sub-val">20 km/h</span>
            </div>
            <input type="range" id="speed-slider" min="1" max="50" step="1" value="20">
        </section>

        <section class="hud-group">
            <h3>走行メトリクス (HUD)</h3>
            <div class="metrics-grid">
                <div class="metric-card">
                    <span class="metric-label">コース / 走行距離</span>
                    <span class="metric-value"><span id="val-distance">0.00</span> <small>km</small></span>
                    <span class="metric-sub" id="val-total-distance">/ 0.00 km</span>
                </div>
                <div class="metric-card">
                    <span class="metric-label">標高 (Altitude)</span>
                    <span class="metric-value"><span id="val-altitude">0.0</span> <small>m</small></span>
                </div>
                <div class="metric-card">
                    <span class="metric-label">斜度 (Slope)</span>
                    <span class="metric-value" id="val-slope-wrap"><span id="val-slope">+0.0</span> <small>%</small></span>
                </div>
                <div class="metric-card">
                    <span class="metric-label">経度・緯度</span>
                    <span class="metric-coords" id="val-coords">139.22, 35.37</span>
                </div>
            </div>
        </section>

        <section class="control-group camera-group">
            <label>空撮カメラ視点</label>
            <div class="btn-group">
                <button id="cam-chase" class="btn toggle active">後方追従 (Chase)</button>
                <button id="cam-drone" class="btn toggle">ドローン空撮 (Aerial)</button>
                <button id="cam-free" class="btn toggle">自由操作 (Free)</button>
            </div>

            <!-- Drone / Camera Adjustment Sliders -->
            <div id="camera-adjust-box" class="camera-adjust-box">
                <div class="label-row">
                    <label for="cam-pitch-slider">カメラ仰角 (角度)</label>
                    <span id="cam-pitch-val" class="sub-val">68°</span>
                </div>
                <input type="range" id="cam-pitch-slider" min="20" max="85" step="1" value="68">

                <div class="label-row" style="margin-top: 6px;">
                    <label for="cam-zoom-slider">カメラ距離 (ズーム)</label>
                    <span id="cam-zoom-val" class="sub-val">15.6</span>
                </div>
                <input type="range" id="cam-zoom-slider" min="13.0" max="17.5" step="0.1" value="15.6">
            </div>
        </section>
    </div>

    <!-- Mini Profile Elevation Chart Overlay -->
    <div id="profile-container">
        <div class="profile-header" id="profile-chart-title">標高プロファイル</div>
        <canvas id="elevation-canvas" width="340" height="70"></canvas>
    </div>

    <script type="module" src="src/main.js"></script>
</body>
</html>
