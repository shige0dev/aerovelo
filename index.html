<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroVelo - 3D Terrain Virtual Cycling</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- MapLibre GL JS (3D Terrain, Satellite & Real-time Full-screen Contours) -->
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/maplibre-contour@0.0.5/dist/index.min.js"></script>
</head>
<body>
    <!-- Fullscreen 3D Map Container -->
    <div id="map"></div>

    <!-- 画面最上段バー: タイトル, コース名, アクション (⚙️ ⛶ 🎥) -->
    <div id="top-bar">
        <div class="top-title-group">
            <h1 class="top-app-title">AeroVelo</h1>
            <span class="version-badge" id="app-version">v2.0.7</span>
        </div>
        <div class="top-course-group">
            <span id="course-name-display" class="top-course-title">読み込み中...</span>
        </div>
        <div class="top-actions-group">
            <button type="button" id="btn-modal-settings" class="icon-btn" title="設定 (GPX / トレーナー / テスト)">⚙️</button>
            <button type="button" id="btn-fullscreen" class="icon-btn" title="全画面表示 (F11)">⛶</button>
            <button type="button" id="btn-toggle-cam-dialog" class="icon-btn" title="カメラ調整を展開">🎥</button>
        </div>
    </div>

    <!-- 画面上部 HUDメトリクス (英語表示×8行縦並び、ベースなし個別配置) -->
    <div id="hud-metrics">
        <div class="hud-item">
            <span class="hud-label">Speed</span>
            <div class="hud-value-box">
                <span id="hud-speed-val" class="hud-val">25.00</span>
                <span class="hud-unit">km/h</span>
            </div>
        </div>
        <div class="hud-item">
            <span class="hud-label">Distance</span>
            <div class="hud-value-box">
                <span id="hud-dist-val" class="hud-val">0.00</span>
                <span class="hud-unit">km</span>
            </div>
        </div>
        <div class="hud-item ble-hud-item" title="ケイデンスセンサー計測値">
            <span class="hud-label">Cadence</span>
            <div class="hud-value-box">
                <span id="hud-cadence-val" class="hud-val">--.--</span>
                <span class="hud-unit">rpm</span>
            </div>
        </div>
        <div class="hud-item ble-hud-item" title="トレーナー/パワーメーター計測値">
            <span class="hud-label">Power</span>
            <div class="hud-value-box">
                <span id="hud-power-val" class="hud-val">--.--</span>
                <span class="hud-unit">W</span>
            </div>
        </div>
        <div class="hud-item">
            <span class="hud-label">Altitude</span>
            <div class="hud-value-box">
                <span id="hud-alt-val" class="hud-val">0.00</span>
                <span class="hud-unit">m</span>
            </div>
        </div>
        <div class="hud-item">
            <span class="hud-label">Slope</span>
            <div class="hud-value-box">
                <span id="hud-slope-val" class="hud-val">+0.00</span>
                <span class="hud-unit">%</span>
            </div>
        </div>
        <div class="hud-item hud-scrubber" id="hud-row-load" title="上下スワイプ・ホイールで負荷変更可能">
            <div class="hud-label-group">
                <span class="hud-label">Load</span>
                <button type="button" id="btn-manual-mode" class="hud-manual-btn" title="手動固定負荷モード切替 (Auto/Manual)">Manual</button>
            </div>
            <div class="hud-value-box">
                <span id="hud-load-val" class="hud-val">0.00</span>
                <span class="hud-unit">%</span>
            </div>
        </div>
        <div class="hud-item hud-scrubber" id="hud-row-zoom" title="上下スワイプ・ホイールでズーム調整可能">
            <span class="hud-label">Zoom</span>
            <div class="hud-value-box">
                <span id="hud-zoom-val" class="hud-val">16.5</span>
            </div>
        </div>
    </div>

    <!-- 2D シンプルコンパス (画面右上・クリックで北向きリセット) -->
    <div id="compass-btn" class="compass-widget" title="北（North）/ クリックで向きリセット">
        <div id="compass-dial" class="compass-dial">
            <div class="compass-pointer-n">
                <span class="compass-n-label">N</span>
            </div>
            <div class="compass-pointer-s"></div>
            <div class="compass-pivot"></div>
        </div>
    </div>

    <!-- カメラ調整フローティングダイアログ (他操作を遮らないモードレスダイアログ) -->
    <div id="camera-dialog" class="floating-dialog" style="display: none;">
        <div class="dialog-header">
            <div class="dialog-title-wrap">
                <span class="dialog-title">CAMERA</span>
                <button type="button" id="cam-free" class="btn toggle mini-cam-free">FREE</button>
            </div>
            <button type="button" id="btn-close-cam-dialog" class="dialog-close" title="閉じる">✕</button>
        </div>
        <div id="camera-adjust-box" class="camera-adjust-box">
            <div class="label-row" style="margin-bottom: 2px;">
                <div class="label-with-btn">
                    <label>Contour</label>
                    <button type="button" id="btn-toggle-contour" class="btn mini-cam-free marker-toggle-btn" title="等高線 (5m) の表示切替">SHOW</button>
                </div>
                <span class="sub-val">5m</span>
            </div>

            <div class="label-row" style="margin-bottom: 2px;">
                <label for="cam-smooth-slider">Smooth</label>
                <span id="cam-smooth-val" class="sub-val">5 (標準)</span>
            </div>
            <input type="range" id="cam-smooth-slider" min="0" max="10" step="1" value="5">

            <div class="label-row" style="margin-top: 3px;">
                <div class="label-with-btn">
                    <label for="cam-fwd-mult-slider">Fwd Look</label>
                    <button type="button" id="btn-toggle-fwd-marker" class="btn mini-cam-free marker-toggle-btn" title="前方注視点マーカーの表示切替">SHOW</button>
                </div>
                <span id="cam-fwd-mult-val" class="sub-val">2.0x</span>
            </div>
            <input type="range" id="cam-fwd-mult-slider" min="0" max="3" step="0.1" value="2.0">

            <div class="label-row" style="margin-top: 3px;">
                <div class="label-with-btn">
                    <label for="cam-bwd-mult-slider">Bwd Look</label>
                    <button type="button" id="btn-toggle-bwd-marker" class="btn mini-cam-free marker-toggle-btn" title="後方注視点マーカーの表示切替">SHOW</button>
                </div>
                <span id="cam-bwd-mult-val" class="sub-val">1.0x</span>
            </div>
            <input type="range" id="cam-bwd-mult-slider" min="0" max="3" step="0.1" value="1.0">

            <div class="label-row" style="margin-top: 3px;">
                <label for="cam-orbit-slider">Angle</label>
                <span id="cam-orbit-val" class="sub-val">0°</span>
            </div>
            <input type="range" id="cam-orbit-slider" min="-180" max="180" step="5" value="0">

            <div class="label-row" style="margin-top: 4px;">
                <label for="cam-pitch-slider">Pitch</label>
                <span id="cam-pitch-val" class="sub-val">68°</span>
            </div>
            <input type="range" id="cam-pitch-slider" min="20" max="75" step="1" value="68">

            <div class="label-row" style="margin-top: 4px;">
                <label for="cam-zoom-slider">Zoom</label>
                <span id="cam-zoom-val" class="sub-val">16.5</span>
            </div>
            <input type="range" id="cam-zoom-slider" min="13.0" max="18.0" step="0.1" value="16.5">
        </div>
    </div>

    <!-- 画面最下段 全幅バー: 標高プロファイルCanvas (全幅) -->
    <div id="bottom-bar">
        <canvas id="elevation-canvas"></canvas>
        <!-- AutoRun ボタン ＆ 再生速度スライドボックス (勾配表示範囲・左上に配置) -->
        <div class="canvas-autorun-group">
            <button type="button" id="btn-play" class="canvas-autorun-btn" title="自動走行 (AutoRun)">AutoRun</button>
            <div id="autorun-speed-box" class="canvas-autorun-speed-box" title="AUTORUN再生速度: 上下スワイプ・ホイールで変更可能">
                <span id="canvas-speed-val" class="canvas-speed-val">25.00</span>
                <span class="canvas-speed-unit">km/h</span>
                <span class="canvas-speed-hint">⇅</span>
            </div>
        </div>
        <!-- 全長表示（標高表示の右上・枠なし） -->
        <span id="bottom-total-dist-tag" class="canvas-total-dist-tag">Total 000.00Km</span>
    </div>

    <!-- 統合設定フローティングダイアログ (⚙️ ボタン直上に展開、他操作を遮らないモードレスダイアログ) -->
    <div id="modal-settings" class="floating-dialog" style="display: none;">
        <div class="dialog-header">
            <span class="dialog-title">SETTINGS</span>
            <button type="button" id="btn-close-settings" class="dialog-close" title="閉じる">✕</button>
        </div>
        <div class="modal-body">
                <!-- セクション 1: コース選定・GPX (枠線なし) -->
                <div class="settings-section">
                    <div class="settings-sec-title">📁 コース選定・GPX</div>
                    <div class="gpx-section-frameless">
                        <div class="preset-row">
                            <select id="preset-select" class="preset-select">
                                <option value="gpx/hiyoshi_12.5km_D738.gpx" selected>🇯🇵 Hiyoshi (12.5km D+738m)</option>
                                <option value="gpx/shimanami_77.2km_D1903.gpx">🇯🇵 Shimanami (77.2km D+1903m)</option>
                                <option value="gpx/kashida_27.9km_D1095.gpx">🇯🇵 Kashida (27.9km D+1095m)</option>
                            </select>
                        </div>
                        <div class="gpx-actions-row">
                            <input type="file" id="gpx-file-input" accept=".gpx" style="display: none;">
                            <button type="button" id="btn-browse" class="action-item action-btn">FILE</button>
                            <a href="https://gpx-edit-pro.ovh/editeur-gpx/?lang=ja" target="_blank" rel="noopener noreferrer" class="action-item action-link">WEB Editor</a>
                        </div>
                        <div class="gsi-row">
                            <button type="button" id="btn-gsi-dem" class="gsi-btn" title="国土地理院 10mメッシュ(DEM10B)データで標高と斜度を精密再計算">
                                <span class="gsi-indicator"></span>
                                <span id="gsi-btn-text">10mメッシュ標高で補正</span>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- セクション 2: スマートトレーナー接続 -->
                <div class="settings-section">
                    <div class="settings-sec-title">⚡ スマートトレーナー (FTMS)</div>
                    <section class="control-group ble-section">
                        <div class="ble-bar">
                            <button type="button" id="btn-ble-connect" class="ble-btn">
                                <span class="ble-dot"></span>
                                <span id="ble-status-text">⚡ トレーナー接続</span>
                            </button>
                            <button type="button" id="btn-ble-disconnect" class="ble-disconnect-btn" style="display: none;" title="切断">✕</button>
                        </div>
                    </section>
                </div>

                <!-- セクション 3: 負荷設定 -->
                <div class="settings-section">
                    <div class="settings-sec-title">🛠️ 負荷設定</div>
                    <div class="test-controls-box">
                        <!-- Manual Slope Slider (0%〜7%) -->
                        <div class="label-row">
                            <div class="label-with-btn">
                                <label for="test-slope-slider">負荷</label>
                                <button type="button" id="btn-settings-manual" class="hud-manual-btn" title="マニュアル優先 (手動固定負荷モード切替)">Manual</button>
                            </div>
                            <span id="test-slope-val" class="sub-val">0.0 %</span>
                        </div>
                        <input type="range" id="test-slope-slider" min="0" max="7" step="0.2" value="0">

                        <!-- Auto Sweep (AUTOSWEEP + 周期: 30秒, 60秒[デフォルト], 120秒) -->
                        <div class="compact-scan-row">
                            <button type="button" id="btn-lfo-toggle" class="btn secondary mini-scan-btn">AUTOSWEEP</button>
                            <div class="lfo-period-wrap">
                                <select id="lfo-period-select" class="mini-select" title="スキャン周期">
                                    <option value="30">30s</option>
                                    <option value="60" selected>60s</option>
                                    <option value="120">120s</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    <script type="module" src="src/main.js"></script>
</body>
</html>
