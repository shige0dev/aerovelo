<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroVelo - 3D Terrain Virtual Cycling</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- MapLibre GL JS (3D Terrain & Satellite) -->
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
</head>
<body>
    <!-- Fullscreen 3D Map Container -->
    <div id="map"></div>

    <!-- 画面最上段バー: タイトル, コース名, アクション (⚙️ ⛶ 🎥) -->
    <div id="top-bar">
        <div class="top-title-group">
            <h1 class="top-app-title">AeroVelo</h1>
            <span class="version-badge" id="app-version">v1.6.8</span>
        </div>
        <div class="top-course-group">
            <span id="course-name-display" class="top-course-title">読み込み中...</span>
        </div>
        <div class="top-actions-group">
            <button type="button" id="btn-modal-settings" class="icon-btn" title="設定 (GPX / トレーナー / テスト)">⚙️</button>
            <button type="button" id="btn-fullscreen" class="icon-btn" title="全画面表示 (F11)">⛶</button>
            <button type="button" id="btn-toggle-cam-dialog" class="icon-btn" title="カメラ調整を展開">🎥</button>
        </div>
    </div>

    <!-- 画面上部 HUDメトリクス (スピード〜パワー: 1行表示×6行縦並び、ベースなし個別配置) -->
    <div id="hud-metrics">
        <div class="hud-item speed-hud-item" id="row-speed" title="AUTOPLAY時のみ上下スワイプ・ホイールで速度変更可能">
            <span class="hud-label">Speed<span id="speed-edit-hint" class="speed-hint" style="display: none;">⇅</span></span>
            <div class="hud-value-box">
                <span id="speed-val" class="hud-val">25.0</span>
                <span class="hud-unit">km/h</span>
            </div>
        </div>
        <div class="hud-item alt-hud-item">
            <span class="hud-label">標高</span>
            <div class="hud-value-box">
                <span id="bottom-alt-display" class="hud-val">0.0</span>
                <span class="hud-unit">m</span>
            </div>
        </div>
        <div class="hud-item slope-hud-item">
            <span class="hud-label">斜度</span>
            <div class="hud-value-box">
                <span id="bottom-slope-display" class="hud-val">+0.0</span>
                <span class="hud-unit">%</span>
            </div>
        </div>
        <div class="hud-item dist-hud-item">
            <span class="hud-label">距離</span>
            <div class="hud-value-box">
                <span id="bottom-dist-display" class="hud-val">0.00</span>
                <span class="hud-unit">km</span>
            </div>
        </div>
        <div class="hud-item ble-hud-item" title="ケイデンスセンサー計測値">
            <span class="hud-label">Cadence</span>
            <div class="hud-value-box">
                <span id="val-cadence" class="hud-val">---</span>
            </div>
        </div>
        <div class="hud-item ble-hud-item" title="トレーナー/パワーメーター計測値">
            <span class="hud-label">Power</span>
            <div class="hud-value-box">
                <span id="val-power" class="hud-val">---</span>
                <span class="hud-unit">W</span>
            </div>
        </div>
        <div class="hud-item slope-ctrl-hud-item" title="トレーナー手動負荷 (0%〜7%)">
            <span class="hud-label">負荷</span>
            <div class="hud-slider-wrap">
                <input type="range" id="v-slope-slider" min="0" max="7" step="0.1" value="0">
            </div>
            <span id="v-slope-val" class="hud-val hud-slope-val">0.0%</span>
        </div>
    </div>

    <!-- カメラ調整フローティングダイアログ (他操作を遮らないモードレスダイアログ) -->
    <div id="camera-dialog" class="floating-cam-dialog" style="display: none;">
        <div class="floating-cam-header">
            <div class="floating-cam-title-wrap">
                <span class="floating-cam-title">CAMERA</span>
                <button type="button" id="cam-free" class="btn toggle mini-cam-free">FREE</button>
            </div>
            <button type="button" id="btn-close-cam-dialog" class="floating-cam-close" title="閉じる">✕</button>
        </div>
        <div id="camera-adjust-box" class="camera-adjust-box">
            <div class="label-row">
                <label for="cam-orbit-slider">Angle</label>
                <span id="cam-orbit-val" class="sub-val">0°</span>
            </div>
            <input type="range" id="cam-orbit-slider" min="-180" max="180" step="5" value="0">

            <div class="label-row" style="margin-top: 4px;">
                <label for="cam-pitch-slider">Pitch</label>
                <span id="cam-pitch-val" class="sub-val">68°</span>
            </div>
            <input type="range" id="cam-pitch-slider" min="20" max="75" step="1" value="68">

            <div class="label-row" style="margin-top: 4px;">
                <label for="cam-zoom-slider">Zoom</label>
                <span id="cam-zoom-val" class="sub-val">16.5</span>
            </div>
            <input type="range" id="cam-zoom-slider" min="13.0" max="18.5" step="0.1" value="16.5">
        </div>
    </div>

    <!-- 画面最下段 全幅バー: 標高プロファイルCanvas (全幅) -->
    <div id="bottom-bar">
        <canvas id="elevation-canvas"></canvas>
        <!-- AutoRun ボタン (勾配表示範囲・左上に配置) -->
        <button type="button" id="btn-play" class="canvas-autorun-btn" title="自動走行 (AutoRun)">AutoRun</button>
        <!-- 全長表示（標高表示の右上・枠なし） -->
        <span id="bottom-total-dist-tag" class="canvas-total-dist-tag">Total000.00Km</span>
    </div>

    <!-- 統合設定フローティングダイアログ (⚙️ ボタン直上に展開、他操作を遮らないモードレスダイアログ) -->
    <div id="modal-settings" class="floating-settings-dialog" style="display: none;">
        <div class="floating-settings-header">
            <span class="floating-settings-title">SETTINGS</span>
            <button type="button" id="btn-close-settings" class="floating-settings-close" title="閉じる">✕</button>
        </div>
        <div class="modal-body">
                <!-- セクション 1: コース選定・GPX (枠線なし) -->
                <div class="settings-section">
                    <div class="settings-sec-title">📁 コース選定・GPX</div>
                    <div class="gpx-section-frameless">
                        <div class="preset-row">
                            <select id="preset-select" class="preset-select">
                                <option value="gpx/hiyoshi_12.5km_D738.gpx" selected>🇯🇵 Hiyoshi (12.5km D+738m)</option>
                                <option value="gpx/shimanami_77.2km_D1903.gpx">🇯🇵 Shimanami (77.2km D+1903m)</option>
                                <option value="gpx/kashida_27.9km_D1095.gpx">🇯🇵 Kashida (27.9km D+1095m)</option>
                            </select>
                        </div>
                        <div class="gpx-actions-row">
                            <input type="file" id="gpx-file-input" accept=".gpx" style="display: none;">
                            <div id="drop-zone" class="action-item drop-zone">
                                <span class="action-label">Drop</span>
                            </div>
                            <button type="button" id="btn-browse" class="action-item action-btn">Explorer</button>
                            <a href="https://gpx-edit-pro.ovh/editeur-gpx/?lang=ja" target="_blank" rel="noopener noreferrer" class="action-item action-link">Editor ↗</a>
                        </div>
                        <div class="gsi-row">
                            <button type="button" id="btn-gsi-dem" class="gsi-btn" title="国土地理院 5mメッシュ(DEM5A)レーザー測量データで標高と斜度を精密再計算">
                                <span class="gsi-indicator"></span>
                                <span id="gsi-btn-text">5mメッシュ標高で補正</span>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- セクション 2: スマートトレーナー接続 -->
                <div class="settings-section">
                    <div class="settings-sec-title">⚡ スマートトレーナー (FTMS)</div>
                    <section class="control-group ble-section">
                        <div class="ble-bar">
                            <button type="button" id="btn-ble-connect" class="ble-btn">
                                <span class="ble-dot" id="ble-indicator"></span>
                                <span id="ble-status-text">⚡ スマートトレーナー接続</span>
                            </button>
                            <button type="button" id="btn-ble-disconnect" class="ble-disconnect-btn" style="display: none;" title="切断">✕</button>
                        </div>
                    </section>
                </div>

                <!-- セクション 3: 負荷設定 (負荷%ボタンなし・コンパクトスキャン) -->
                <div class="settings-section">
                    <div class="settings-sec-title">🛠️ 負荷設定</div>
                    <div id="test-controls-box" class="test-controls-box">
                        <!-- Manual Slope Slider (0%〜7%) -->
                        <div class="label-row">
                            <label for="test-slope-slider">手動指示負荷 (Slope)</label>
                            <span id="test-slope-val" class="sub-val">0.0 %</span>
                        </div>
                        <input type="range" id="test-slope-slider" min="0" max="7" step="0.2" value="0">

                        <!-- Auto Sweep (コンパクト表示: 連続スキャン + 周期: 30秒, 60秒[デフォルト], 120秒) -->
                        <div class="compact-scan-row">
                            <button type="button" id="btn-lfo-toggle" class="btn secondary mini-scan-btn">連続スキャン</button>
                            <div class="lfo-period-wrap">
                                <label for="lfo-period-select">周期:</label>
                                <select id="lfo-period-select" class="mini-select">
                                    <option value="30">30秒</option>
                                    <option value="60" selected>60秒</option>
                                    <option value="120">120秒</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    <script type="module" src="src/main.js"></script>
</body>
</html>
