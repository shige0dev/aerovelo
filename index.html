<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroVelo - 3D Terrain Virtual Cycling</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- MapLibre GL JS (3D Terrain & Satellite) -->
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
</head>
<body>
    <!-- Fullscreen 3D Map Container -->
    <div id="map"></div>

    <!-- UI Overlay -->
    <div id="ui-panel">
        <header class="panel-header">
            <div class="header-top">
                <h1>AeroVelo <span>3D Terrain</span></h1>
                <span class="version-badge" id="app-version">v0.9.6</span>
            </div>
            <p class="subtitle" id="course-title">実地形 3D 衛星空撮バーチャルサイクリング</p>
        </header>

        <!-- GPX Course Actions: Drop, Explorer, Editor -->
        <section class="control-group gpx-section">
            <div class="preset-row">
                <select id="preset-select" class="preset-select">
                    <option value="gpx/hiyoshi_12.5km_D738.gpx" selected>🇯🇵 Hiyoshi (12.5km D+738m)</option>
                    <option value="gpx/shimanami_77.2km_D1903.gpx">🇯🇵 Shimanami (77.2km D+1903m)</option>
                    <option value="gpx/kashida_27.9km_D1095.gpx">🇯🇵 Kashida (27.9km D+1095m)</option>
                </select>
            </div>
            <div class="gpx-actions-row">
                <input type="file" id="gpx-file-input" accept=".gpx" style="display: none;">
                <div id="drop-zone" class="action-item drop-zone">
                    <span class="action-label">Drop</span>
                </div>
                <button type="button" id="btn-browse" class="action-item action-btn">Explorer</button>
                <a href="https://gpx-edit-pro.ovh/editeur-gpx/?lang=ja" target="_blank" rel="noopener noreferrer" class="action-item action-link">Editor ↗</a>
            </div>
        </section>

        <!-- Progress & Speed Control -->
        <section class="control-group">
            <div class="label-row">
                <label for="progress-slider">コース進捗率</label>
                <div class="input-wrap">
                    <input type="number" id="progress-input" min="0" max="100" step="0.1" value="0.0">
                    <span class="unit">%</span>
                </div>
            </div>
            <input type="range" id="progress-slider" min="0" max="100" step="0.05" value="0">
        </section>

        <!-- Playback Controls (ボタン高さをスマートに削減) -->
        <section class="control-group">
            <div class="buttons-row">
                <button id="btn-play" class="btn primary">再生 (Auto Fly)</button>
                <button id="btn-reset" class="btn secondary">リセット (0%)</button>
            </div>
            <div class="label-row" style="margin-top: 4px;">
                <label for="speed-slider">走行速度</label>
                <span id="speed-val" class="sub-val">25 km/h</span>
            </div>
            <input type="range" id="speed-slider" min="1" max="50" step="1" value="25">
        </section>

        <section class="hud-group">
            <h3>走行メトリクス (HUD)</h3>
            <div class="metrics-grid">
                <div class="metric-card">
                    <span class="metric-label">コース / 走行距離</span>
                    <span class="metric-value"><span id="val-distance">0.00</span> <small>km</small></span>
                    <span class="metric-sub" id="val-total-distance">/ 0.00 km</span>
                </div>
                <div class="metric-card">
                    <span class="metric-label">標高 (Altitude)</span>
                    <span class="metric-value"><span id="val-altitude">0.0</span> <small>m</small></span>
                </div>
                <div class="metric-card">
                    <span class="metric-label">斜度 (Slope)</span>
                    <span class="metric-value" id="val-slope-wrap"><span id="val-slope">+0.0</span> <small>%</small></span>
                </div>
                <div class="metric-card">
                    <span class="metric-label">経度・緯度</span>
                    <span class="metric-coords" id="val-coords">0.00, 0.00</span>
                </div>
            </div>
        </section>

        <!-- Camera Control: Track & Free -->
        <section class="control-group camera-group">
            <div class="btn-group">
                <button id="cam-chase" class="btn toggle active">ライダー追従 (Track)</button>
                <button id="cam-free" class="btn toggle">自由操作 (Free)</button>
            </div>

            <!-- Camera Adjustment Sliders -->
            <div id="camera-adjust-box" class="camera-adjust-box">
                <div class="label-row">
                    <label for="cam-orbit-slider">アングル (真後ろ基準)</label>
                    <span id="cam-orbit-val" class="sub-val">0° (真後ろ)</span>
                </div>
                <input type="range" id="cam-orbit-slider" min="-180" max="180" step="5" value="0">

                <div class="label-row" style="margin-top: 4px;">
                    <label for="cam-pitch-slider">Pitch (仰角)</label>
                    <span id="cam-pitch-val" class="sub-val">68°</span>
                </div>
                <input type="range" id="cam-pitch-slider" min="20" max="75" step="1" value="68">

                <div class="label-row" style="margin-top: 4px;">
                    <label for="cam-zoom-slider">Zoom (距離)</label>
                    <span id="cam-zoom-val" class="sub-val">16.5</span>
                </div>
                <input type="range" id="cam-zoom-slider" min="13.0" max="18.5" step="0.1" value="16.5">
            </div>
        </section>
    </div>

    <!-- Mini Profile Elevation Chart Overlay -->
    <div id="profile-container">
        <div class="profile-header" id="profile-chart-title">標高プロファイル</div>
        <canvas id="elevation-canvas" width="340" height="70"></canvas>
    </div>

    <script type="module" src="src/main.js"></script>
</body>
</html>
